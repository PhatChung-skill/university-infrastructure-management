{% extends "auth/auth_base.html" %}
{% block auth_title %}Hoàn tất{% endblock %}
{% block auth_content %}
<div class="card auth-card login-card">
  <div class="card-body text-center">
    <div class="auth-illus"><i class="bi bi-check2-circle" aria-hidden="true"></i></div>
    <div class="auth-card-head">
      <h1>Mật khẩu đã được cập nhật</h1>
      <p class="text-muted small mb-0">Bạn có thể đăng nhập ngay bằng mật khẩu mới.</p>
    </div>
    <div class="d-grid gap-2">
      <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Đăng nhập</a>
      <a href="{% url 'home' %}" class="btn btn-outline-secondary">Về trang chủ</a>
    </div>
  </div>
</div>
{% endblock %}
