{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <title>Không tìm thấy trang</title>
  <style>
    .err-hero {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #1b5e20, #66bb6a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.04em;
    }
    .err-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(27, 94, 32, 0.12);
      overflow: hidden;
    }
    .err-icon-wrap {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(145deg, #e8f5e9, #c8e6c9);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .err-icon-wrap i { font-size: 2.5rem; color: #2e7d32; }
  </style>
</head>
<body class="login-bg">
  <div class="container d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card err-card">
        <div class="card-body text-center p-4 p-md-5">
          <div class="err-icon-wrap">
            <i class="bi bi-compass" aria-hidden="true"></i>
          </div>
          <p class="err-hero mb-2">404</p>
          <h1 class="h4 fw-bold text-dark mb-3">Không thể truy cập trang này</h1>
          <p class="text-muted mb-4 mx-auto" style="max-width: 28rem;">
            Đường dẫn bạn mở không tồn tại hoặc đã được thay đổi. Hãy quay về trang chủ để tiếp tục sử dụng hệ thống quản lý cơ sở hạ tầng.
          </p>
          <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-4">
              <i class="bi bi-house-door me-2" aria-hidden="true"></i>Về trang chủ
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary btn-lg px-4">Quay lại trước</a>
          </div>
        </div>
      </div>
      <p class="text-center mt-4 text-muted small mb-0">Hệ thống quản lý cơ sở hạ tầng</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
